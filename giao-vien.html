const fmt = s => String(Math.floor(s / 60)).padStart(2, '0') + ':' + String(s % 60).padStart(2, '0');
const shuffle = a => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
const store = { get(k) { try { return localStorage.getItem(k); } catch (e) { return null; } }, set(k, v) { try { localStorage.setItem(k, v); } catch (e) {} } };

function emptyAns() { return BAI.map(b => b.type === 'match' ? { found: [], wrong: 0, miss: [], order: null } : b.items.map(() => b.type === 'fill' ? null : -1)); }
function isRight(i, j, ans) {
  const b = BAI[i], a = ans[i];
  if (b.type === 'match') return a.found.includes(j);
  return b.type === 'fill' ? (a[j] || '').toLowerCase() === b.items[j].w : a[j] === b.items[j].k;
}
function count(i) { return BAI[i].type === 'match' ? BAI[i].pairs.length : BAI[i].items.length; }
function score(i, ans) { const b = BAI[i]; let c = 0; for (let j = 0; j < count(i); j++) if (isRight(i, j, ans)) c++; return c * b.pts / count(i); }

let player = null, playingId = null;
function stopAudio() { if (player) { player.pause(); player = null; } playingId = null; $$('.play.on').forEach(b => { b.classList.remove('on'); b.textContent = '▶'; }); }
function playClip(id, btn, onEnd) {
  if (playingId === id) { stopAudio(); return false; }
  stopAudio();
  player = new Audio(SETS[EXAM_ID].audio[id]); playingId = id;
  if (btn) { btn.classList.add('on'); btn.textContent = '■'; }
  player.onended = () => { player = null; playingId = null; if (btn) { btn.classList.remove('on'); btn.textContent = '▶'; } if (onEnd) onEnd(); };
  player.play().catch(() => { stopAudio(); });
  return true;
}

function encode(r) { return 'IOE3.' + btoa(unescape(encodeURIComponent(JSON.stringify(r)))); }
function decode(s) {
  s = (s || '').trim().replace(/\s+/g, '');

function render() { bar(); ({ start: rStart, bai: rBai, result: rResult })[S.phase](); }

function rStart() {
  $('#app').innerHTML = `
  <section class="card">
    <div class="eyebrow">${esc(SETS[EXAM_ID].name)}</div>
    <h1>Phòng thi thử buổi 3</h1>
    <p class="muted">Đề gồm 4 bài, làm lần lượt trong ${SETS[EXAM_ID].min} phút. Nộp bài nào thì không quay lại được bài đó. Muốn đạt, em cần từ 75% điểm trở lên ở từng bài và ở tổng điểm.</p>
    <div class="rules">${BAI.map((b, i) => `<div class="rule"><span class="eyebrow">Bài ${i + 1}</span><b>${esc(b.title)}</b><span class="pts">${count(i)} ${b.type === 'match' ? 'cặp' : 'câu'} · ${b.pts} điểm</span></div>`).join('')}</div>
    <div class="field" style="max-width:360px"><label for="name">Họ và tên thí sinh</label><input id="name" value="${esc(S.name)}" autocomplete="off"></div>
    <p class="note">Bài 2 có phần nghe: kiểm tra loa hoặc tai nghe trước khi bắt đầu.</p>
    <div class="row"><button class="btn go" id="begin">Bắt đầu làm bài</button></div>
  </section>`;
  $('#begin').onclick = () => {
    S.name = $('#name').value.trim() || 'Học sinh'; store.set('ts-name', S.name);
    S.phase = 'bai'; timer = setInterval(tick, 1000); render();
  };
}

function head(b) { return `<div><div class="eyebrow">Bài ${S.bai + 1} / ${BAI.length} · ${b.pts} điểm</div><h2>${esc(b.title)}</h2></div><p class="muted" style="margin:0">${esc(b.desc)}</p>`; }
function submitRow(extra) {
  return `<div class="row">${extra || ''}<span class="spacer"></span>
    ${S.confirm ? '<span class="note">Bấm lần nữa để nộp bài này.</span><button class="btn" id="cancel">Làm tiếp</button><button class="btn warn" id="submit">Nộp bài</button>'
                : '<button class="btn go" id="submit">Nộp bài</button>'}</div>`;
}
function nextBai() {
  stopAudio(); S.confirm = false; S.done[S.bai] = true; S.sel = null;
  if (S.bai < BAI.length - 1) { S.bai++; S.q = 0; render(); window.scrollTo(0, 0); } else finish();
}
function wireSubmit() {
  $('#submit').onclick = () => { if (!S.confirm) { S.confirm = true; render(); } else nextBai(); };
  const c = $('#cancel'); if (c) c.onclick = () => { S.confirm = false; render(); };
}

function rBai() {
  const b = BAI[S.bai];
  if (b.type === 'match') return rMatch(b);
  const it = b.items[S.q], a = S.ans[S.bai];
  let body = '';
  if (b.type === 'listen') {
    const used = S.plays[it.a] || 0, on = playingId === it.a;
    body += `<div class="audio"><button class="play ${on ? 'on' : ''}" id="play" aria-label="Nghe" ${used >= MAX_PLAYS && !on ? 'disabled' : ''}>${on ? '■' : '▶'}</button>
      <div><b>${it.a === 'p' ? SETS[EXAM_ID].pLabel : 'Câu ' + (S.q + 1)}</b><div class="note" id="left">Còn ${MAX_PLAYS - used} lượt nghe</div></div></div>`;
  }
  if (b.type === 'fill') {
    body += `<div class="qhead"><span class="qnum">Câu ${S.q + 1}</span></div><p class="sentence">${esc(it.b)} …</p>${wordHTML(it.m)}<p class="sentence">… ${esc(it.e)}</p>`;
  } else {
    body += `<div class="qhead"><span class="qnum">Câu ${S.q + 1}</span><span class="qtext">${esc(it.q)}</span></div>
      <div class="opts">${it.o.map((o, j) => `<button class="opt ${a[S.q] === j ? 'sel' : ''}" data-j="${j}"><span class="k">${L[j]}</span><span>${esc(o)}</span></button>`).join('')}</div>`;
  }
  const answered = j => b.type === 'fill' ? !!(a[j] && !a[j].includes(' ')) : a[j] >= 0;
  const tray = `<div class="tray">${b.items.map((_, j) => `<button class="dot ${answered(j) ? 'ans' : ''} ${j === S.q ? 'now' : ''}" data-q="${j}">${j + 1}</button>`).join('')}</div>`;
  const nav = `<button class="btn" id="prev" ${S.q === 0 ? 'disabled' : ''}>← Câu trước</button><button class="btn" id="next" ${S.q === b.items.length - 1 ? 'disabled' : ''}>Câu sau →</button>`;
  $('#app').innerHTML = `<section class="card">${head(b)}${body}${tray}${submitRow(nav)}</section>`;

  $$('.opt').forEach(el => el.onclick = () => { a[S.q] = +el.dataset.j; render(); });
  $$('.dot').forEach(el => el.onclick = () => { S.q = +el.dataset.q; render(); });
  $('#prev').onclick = () => { S.q--; render(); };
  $('#next').onclick = () => { S.q++; render(); };
  if (b.type === 'listen') $('#play').onclick = e => {
    if (playingId === it.a) { stopAudio(); render(); return; }
    if ((S.plays[it.a] || 0) >= MAX_PLAYS) return;
    S.plays[it.a] = (S.plays[it.a] || 0) + 1;
    playClip(it.a, e.currentTarget, () => { if (S.phase === 'bai') render(); });
    $('#left').textContent = `Còn ${MAX_PLAYS - S.plays[it.a]} lượt nghe`;
  };
  if (b.type === 'fill') wireWord($('.word'), it.m, a[S.q], v => { a[S.q] = v; const d = $(`.dot[data-q="${S.q}"]`); if (d) d.classList.toggle('ans', !v.includes(' ')); }, true);
  wireSubmit();
}

function wordHTML(mask) {
  let n = 0;
  return `<div class="word">${[...mask].map(ch => ch === '_' ? `<input data-i="${n++}" maxlength="1" aria-label="Chữ cái còn thiếu" autocomplete="off" spellcheck="false">` : `<span class="fixed">${esc(ch)}</span>`).join('')}</div>`;
}
function wireWord(root, mask, cur, onChange, focus) {
  const ins = [...root.querySelectorAll('input')];
  const blanks = [...mask].map((c, i) => c === '_' ? i : -1).filter(i => i >= 0);
  const base = cur || mask.replace(/_/g, ' ');
  ins.forEach((inp, k) => { const ch = base[blanks[k]]; inp.value = ch && ch !== ' ' ? ch : ''; });
  const save = () => { const arr = [...mask]; ins.forEach((inp, k) => arr[blanks[k]] = (inp.value || ' ').toLowerCase()); onChange(arr.join('')); };
  ins.forEach((inp, k) => {
    inp.addEventListener('input', () => { inp.value = inp.value.replace(/[^a-zA-Z]/g, '').slice(-1); save(); if (inp.value && ins[k + 1]) ins[k + 1].focus(); });
    inp.addEventListener('keydown', e => { if (e.key === 'Backspace' && !inp.value && ins[k - 1]) ins[k - 1].focus(); });
  });
  if (focus && ins[0]) ins[0].focus();
}

function rMatch(b) {
  const a = S.ans[S.bai];
  if (!a.order) a.order = shuffle(b.pairs.flatMap((p, i) => [{ i, en: true, t: p[0] }, { i, en: false, t: p[1] }]));
  $('#app').innerHTML = `<section class="card">${head(b)}
    <div class="grid">${a.order.map((t, k) => `<button class="tile ${t.en ? 'en' : ''} ${a.found.includes(t.i) ? 'gone' : ''} ${S.sel === k ? 'sel' : ''}" data-k="${k}">${esc(t.t)}</button>`).join('')}</div>
    <p class="note">Đã nối đúng ${a.found.length}/${b.pairs.length} cặp.</p>${submitRow()}</section>`;
  $$('.tile').forEach(el => el.onclick = () => {
    const k = +el.dataset.k, t = a.order[k];
    if (a.found.includes(t.i)) return;
    if (S.sel === null || S.sel === k) { S.sel = S.sel === k ? null : k; render(); return; }
    const s = a.order[S.sel];
    if (s.en === t.en) { S.sel = k; render(); return; }
    if (s.i === t.i) {
      a.found.push(t.i); S.sel = null; render();
      if (a.found.length === b.pairs.length) setTimeout(nextBai, 400);
    } else {
      a.wrong++; const en = s.en ? s : t, vi = s.en ? t : s; a.miss.push([en.i, vi.i]);
      const prev = S.sel; S.sel = null; render();
      [prev, k].forEach(x => $(`.tile[data-k="${x}"]`).classList.add('wrong'));
    }
  });
  wireSubmit();
}

function finish() {
  clearInterval(timer); timer = null; stopAudio();
  S.done = BAI.map(() => true); S.phase = 'result'; S.at = new Date().toISOString();
  const ans = S.ans.map((a, i) => BAI[i].type === 'match' ? { found: a.found, wrong: a.wrong, miss: a.miss } : a);
  S.code = encode({ id: EXAM_ID, n: S.name, at: S.at, u: S.used, s: TOTAL_SEC - Math.max(0, S.left), a: ans });
  store.set('ts-last-code', S.code);
  render(); window.scrollTo(0, 0);
}

function wrongList() {
  const out = [];
  BAI.forEach((b, i) => { for (let j = 0; j < count(i); j++) if (!isRight(i, j, S.ans)) out.push([i, j]); });
  return out;
}

function rResult() {
  const sc = BAI.map((_, i) => score(i, S.ans)), total = sc.reduce((x, y) => x + y, 0), max = BAI.reduce((s, b) => s + b.pts, 0);
  const pass = sc.every((s, i) => s >= BAI[i].pts * .75) && total >= max * .75;
  const wl = wrongList();
  const fixed = wl.filter(([i, j]) => S.retry[i + '-' + j] === true).length;
  $('#app').innerHTML = `
  <section class="card">
    <div class="eyebrow">Kết quả · ${esc(S.name)} · làm trong ${fmt(TOTAL_SEC - Math.max(0, S.left))}</div>
    <div class="row"><span class="verdict ${pass ? 'ok' : 'bad'}">${pass ? 'ĐẠT' : 'CHƯA ĐẠT'}</span><span class="verdict">${total}/${max}</span></div>
    <div class="score">${BAI.map((b, i) => `<div class="sbox"><span class="eyebrow">Bài ${i + 1} · ${esc(b.title)}</span><span class="n">${sc[i]}<span class="muted" style="font-size:18px">/${b.pts}</span></span>
      <span><span class="chip ${sc[i] >= b.pts * .75 ? 'ok' : 'bad'}">${sc[i] >= b.pts * .75 ? 'Đạt ≥ 75%' : 'Dưới 75%'}</span></span></div>`).join('')}</div>
    <p class="note">Điều kiện đạt: từng bài và tổng điểm đều từ 75% trở lên.</p>
  </section>
  <section class="card">
    <div class="row"><h2>Các câu cần xem lại</h2><span class="spacer"></span><span class="chip ${fixed === wl.length ? 'ok' : 'bad'}">Đã sửa đúng ${fixed}/${wl.length}</span></div>
    <p class="muted" style="margin:0">${wl.length ? 'Nghe cô giảng, sau đó làm lại từng câu. Điểm chính thức ở trên không thay đổi.' : 'Em không sai câu nào. Giỏi lắm!'}</p>
    <div class="items">${wl.map(([i, j]) => retryCard(i, j)).join('')}</div>
  </section>
  <section class="card">
    <h3>Mã kết quả gửi cô</h3>
    <div class="codebox"><code id="code">${esc(S.code)}</code>
      <div class="row"><button class="btn small" id="copy">Sao chép mã</button><span class="note" id="copied"></span></div></div>
    <p class="note">Cô mở bản giáo viên và dán mã này để chữa chi tiết. Nếu cô dùng cùng máy và cùng trình duyệt, bản giáo viên tự nhận kết quả mới nhất.</p>
    <div class="row"><button class="btn go" id="again">Làm lại cả đề</button></div>
  </section>`;
  wireRetry();
  $('#copy').onclick = () => {
    const done = () => $('#copied').textContent = 'Đã sao chép.';
    const fallback = () => { const r = document.createRange(); r.selectNodeContents($('#code')); const s = getSelection(); s.removeAllRanges(); s.addRange(r); $('#copied').textContent = 'Đã bôi đen mã, bấm Ctrl+C để sao chép.'; };
    try { navigator.clipboard.writeText(S.code).then(done, fallback); } catch (e) { fallback(); }
  };
  $('#again').onclick = () => { stopAudio(); S = fresh(S.name); render(); window.scrollTo(0, 0); };
}

function retryCard(i, j) {
  const b = BAI[i], key = i + '-' + j, st = S.retry[key];
  const fb = st === true ? '<span class="feedback ok">Đúng rồi!</span>' : st === false ? '<span class="feedback bad">Chưa đúng, thử lại nhé.</span>' : '';
  let body = '';
  if (b.type === 'match') {
    const p = b.pairs[j];
    const others = shuffle(b.pairs.map((x, k) => k).filter(k => k !== j)).slice(0, 3);
    const opts = S.retry['o' + key] || (S.retry['o' + key] = shuffle([j, ...others]));
    body = `<div class="qhead"><span class="qtext"><b>${esc(p[0])}</b> ${esc(SETS[EXAM_ID].matchQ)}</span></div>
      <div class="opts">${opts.map((k, n) => `<button class="opt" data-key="${key}" data-v="${k}"><span class="k">${L[n]}</span><span>${esc(b.pairs[k][1])}</span></button>`).join('')}</div>`;
  } else if (b.type === 'fill') {
    const it = b.items[j];
    body = `<p class="sentence">${esc(it.b)} …</p><div data-word="${key}">${wordHTML(it.m)}</div><p class="sentence">… ${esc(it.e)}</p>
      <div class="row"><button class="btn small" data-check="${key}">Kiểm tra</button></div>`;
  } else {
    const it = b.items[j], mine = S.ans[i][j];
    body = (b.type === 'listen' ? `<div class="audio"><button class="play" data-clip="${it.a}" aria-label="Nghe lại">▶</button><div><b>Nghe lại${it.a === 'p' ? ' đoạn văn' : ''}</b><div class="note">Nghe bao nhiêu lần cũng được</div></div></div>` : '')
      + `<div class="qhead"><span class="qtext">${esc(it.q)}</span></div>
      <div class="opts">${it.o.map((o, n) => `<button class="opt" data-key="${key}" data-v="${n}"><span class="k">${L[n]}</span><span>${esc(o)}</span></button>`).join('')}</div>
      <div class="note">Lúc thi em đã chọn: ${mine >= 0 ? L[mine] + '. ' + esc(it.o[mine]) : 'chưa chọn'}</div>`;
  }
  return `<div class="item ${st === true ? 'okk' : ''}" id="it-${key}"><div class="item-head"><span class="where">Bài ${i + 1} · ${b.type === 'match' ? 'Cặp' : 'Câu'} ${j + 1}</span><span class="spacer"></span>${fb}</div>${body}</div>`;
}

function wireRetry() {
  $$('[data-clip]').forEach(btn => btn.onclick = () => playClip(btn.dataset.clip, btn));
  $$('.opt[data-key]').forEach(btn => btn.onclick = () => {
    const [i, j] = btn.dataset.key.split('-').map(Number), v = +btn.dataset.v, b = BAI[i];
    const ok = b.type === 'match' ? v === j : v === b.items[j].k;
    S.retry[btn.dataset.key] = ok; stopAudio(); keepScroll(rResult);
  });
  $$('[data-word]').forEach(box => {
    const [i, j] = box.dataset.word.split('-').map(Number), it = BAI[i].items[j];
    let val = S.retry['w' + box.dataset.word] || null;
    wireWord(box, it.m, val, v => { val = v; S.retry['w' + box.dataset.word] = v; }, false);
    $(`[data-check="${box.dataset.word}"]`).onclick = () => { S.retry[box.dataset.word] = (val || '').toLowerCase() === it.w; keepScroll(rResult); };
  });
}
function keepScroll(fn) { const y = window.scrollY; fn(); window.scrollTo(0, y); }

// =====================================================================
// BẢN GIÁO VIÊN
// =====================================================================
let T = { r: null, all: false, err: '' };
function tStart() {
  document.body.classList.add('teacher-mode');
  $('#bar').hidden = true;
  const last = store.get('ts-last-code');
  let lastInfo = null; try { if (last) lastInfo = decode(last); } catch (e) {}
  $('#app').innerHTML = `
  <section class="card">
    <div class="eyebrow">Bản giáo viên · Luyện IOE lớp 6</div>
    <h1>Chữa bài trên máy</h1>
    <p class="muted">Mở kết quả bài làm của học sinh để xem từng câu sai, đáp án đúng và lời giải thích. Câu nghe có loa và lời thoại để cho học sinh nghe lại.</p>
    ${lastInfo ? `<div class="row"><button class="btn go" id="last">Mở kết quả vừa làm trên máy này</button><span class="note">${esc(SETS[lastInfo.id].short)} · ${esc(lastInfo.n)} · ${new Date(lastInfo.at).toLocaleString('vi-VN')}</span></div>` : ''}
    <div class="field"><label for="paste">Dán mã kết quả từ bản học sinh</label><textarea id="paste" placeholder="IOE3.…"></textarea></div>
    ${T.err ? `<p class="feedback bad" style="margin:0">${esc(T.err)}</p>` : ''}
    <div class="row"><button class="btn" id="open">Xem kết quả</button></div><div class="row"><span class="note">Xem đề và lời giải (không có bài làm):</span>${Object.keys(SETS).map(id => `<button class="btn small" data-set="${id}">${esc(SETS[id].short)}</button>`).join('')}</div>
  </section>`;
  if (lastInfo) $('#last').onclick = () => { T.r = lastInfo; T.all = false; tReview(); };
  $('#open').onclick = () => { try { T.r = decode($('#paste').value); T.err = ''; T.all = false; tReview(); } catch (e) { T.err = e.message || 'Không đọc được mã. Kiểm tra lại xem đã dán đủ mã chưa.'; tStart(); } };
  $$('[data-set]').forEach(b => b.onclick = () => { useSet(b.dataset.set); T.r = null; T.all = true; tReview(); });
}

function tReview() {
  const r = T.r, ans = r ? r.a : null;
  const sc = r ? BAI.map((_, i) => score(i, ans)) : null;
  const total = sc ? sc.reduce((x, y) => x + y, 0) : 0, max = BAI.reduce((s, b) => s + b.pts, 0);
  const pass = sc && sc.every((s, i) => s >= BAI[i].pts * .75) && total >= max * .75;
  let html = `<section class="card"><div class="row"><button class="btn small" id="back">← Mở kết quả khác</button></div>`;
  if (r) {
    html += `<div class="eyebrow">${esc(SETS[EXAM_ID].short)} · ${esc(r.n)} · ${new Date(r.at).toLocaleString('vi-VN')} · làm trong ${fmt(r.s)}</div>
      <div class="row"><span class="verdict ${pass ? 'ok' : 'bad'}">${pass ? 'ĐẠT' : 'CHƯA ĐẠT'}</span><span class="verdict">${total}/${max}</span></div>
      <div class="score">${BAI.map((b, i) => {
        let wrong = 0; for (let j = 0; j < count(i); j++) if (!isRight(i, j, ans)) wrong++;
        return `<div class="sbox"><span class="eyebrow">Bài ${i + 1} · ${esc(b.title)}</span><span class="n">${sc[i]}<span class="muted" style="font-size:18px">/${b.pts}</span></span>
        <span class="note">Sai ${wrong} · thời gian ${fmt(r.u[i])}${b.type === 'match' ? ' · nối nhầm ' + ans[i].wrong + ' lần' : ''}</span></div>`; }).join('')}</div>
      <div class="row"><button class="btn small ${T.all ? '' : 'on'}" id="fWrong">Chỉ câu sai</button><button class="btn small ${T.all ? 'on' : ''}" id="fAll">Tất cả các câu</button></div>`;
  } else {
    html += `<div class="eyebrow">Đề và lời giải</div><h2>${esc(SETS[EXAM_ID].name)} · đáp án chi tiết</h2>`;
  }
  html += `</section>`;
  BAI.forEach((b, i) => {
    const idx = [...Array(count(i)).keys()].filter(j => T.all || !r || !isRight(i, j, ans));
    if (!idx.length) return;
    html += `<section class="card"><h2>Bài ${i + 1}. ${esc(b.title)}</h2><div class="items">${idx.map(j => tCard(i, j, ans)).join('')}</div>
      ${b.type === 'match' && r && ans[i].miss.length ? `<div class="explain"><b>Các lần học sinh nối nhầm</b>${ans[i].miss.map(([e, v]) => `<span>${esc(b.pairs[e][0])} ✗ ${esc(b.pairs[v][1])}</span>`).join('')}</div>` : ''}
      ${b.type === 'listen' && PASSAGE ? `<div class="explain"><b>Toàn bộ đoạn văn (câu ${SETS[EXAM_ID].pRange})</b><span class="transcript">${esc(PASSAGE)}</span></div>` : ''}</section>`;
  });
  $('#app').innerHTML = html;
  $('#back').onclick = () => { stopAudio(); tStart(); };
  if ($('#fWrong')) { $('#fWrong').onclick = () => { T.all = false; keepScroll(tReview); }; $('#fAll').onclick = () => { T.all = true; keepScroll(tReview); }; }
  $$('[data-clip]').forEach(btn => btn.onclick = () => playClip(btn.dataset.clip, btn));
}

function tCard(i, j, ans) {
  const b = BAI[i], ok = ans ? isRight(i, j, ans) : true, status = ans ? `<span class="chip ${ok ? 'ok' : 'bad'}">${ok ? 'Đúng' : 'Sai'}</span>` : '';
  let body = '';
  if (b.type === 'match') {
    const p = b.pairs[j];
    body = `<div class="qtext"><b>${esc(p[0])}</b> = ${esc(p[1])}</div><div class="explain"><b>Ghi chú</b><span>${esc(p[2])}</span></div>`;
    if (ans && !ok) body += `<div class="note">Học sinh chưa nối được cặp này trước khi nộp bài.</div>`;
  } else if (b.type === 'fill') {
    const it = b.items[j], mine = ans ? ans[i][j] : null;
    body = `<p class="sentence">${esc(it.b)} <b>${esc(it.m)}</b> ${esc(it.e)}</p>
      ${ans ? `<div class="opts"><div class="opt ${ok ? 'right' : 'wrongpick'}"><span class="k">HS</span><span>${mine ? esc(mine.replace(/ /g, '_')) : '(bỏ trống)'}</span></div>` : '<div class="opts">'}
      ${!ok || !ans ? `<div class="opt right"><span class="k">✓</span><span>${esc(it.w)}</span></div>` : ''}</div>
      <div class="explain"><b>Giải thích</b><span>${esc(it.x)}</span></div>`;
  } else {

    const W = 640, H = 200, L = 34, B = 34, step = (W - L - 10) / pts.length, bw = Math.min(34, step * .6);
    const y = p => 10 + (H - B - 10) * (1 - p / 100);
    return `<div class="scroll"><svg viewBox="0 0 ${W} ${H}" class="trend" role="img" aria-label="Điểm tổng theo thời gian">
      ${[0, 50, 100].map(v => `<text x="${L - 6}" y="${y(v) + 4}" text-anchor="end" class="ax">${v}%</text><line x1="${L}" x2="${W - 6}" y1="${y(v)}" y2="${y(v)}" class="grid"/>`).join('')}
      <line x1="${L}" x2="${W - 6}" y1="${y(75)}" y2="${y(75)}" class="pass"/>
      ${pts.map((p, i) => { const x = L + step * i + (step - bw) / 2; return `<rect x="${x}" y="${y(p.p)}" width="${bw}" height="${y(0) - y(p.p)}" rx="5" class="${p.web ? 'bw' : 'bi'}"><title>${esc(p.l)}: ${p.p}%</title></rect>
        <text x="${x + bw / 2}" y="${y(p.p) - 5}" text-anchor="middle" class="val">${p.p}</text><text x="${x + bw / 2}" y="${H - 14}" text-anchor="middle" class="ax">${esc(p.l.length > 10 ? p.l.slice(0, 9) + '…' : p.l)}</text>`; }).join('')}
    </svg></div>`;
  }

  function rightOf(bai, i, j, ans) {
    const b = bai[i], a = ans[i];
    if (b.type === 'match') return a.found.includes(j);
    return b.type === 'fill' ? (a[j] || '').toLowerCase() === b.items[j].w : a[j] === b.items[j].k;
  }
  function hbars(rows) {
    return `<div class="hbars">${rows.map(r => `<div class="hbar ${r.p < 75 ? 'bad' : ''}"><span class="lbl">${esc(r.l)}</span><span class="bg"><i style="width:${r.p}%"></i><span class="m75"></span></span><span class="num"><b>${r.p}%</b> <span class="note">${esc(r.n)}</span></span></div>`).join('')}</div>`;
  }
  function analysisView(at, rd) {
    const byType = {}, byTag = {};
    const add = (o, k, s, m) => { o[k] = o[k] || { s: 0, m: 0, c: 0 }; o[k].s += s; o[k].m += m; o[k].c++; };
    at.forEach(x => {
      const set = SETS[x.set_id]; if (!set) return;
      set.bai.forEach((b, i) => {
        add(byType, TYPE_LABEL[b.type], +x.scores[i], +x.maxes[i]);
        const n = b.type === 'match' ? b.pairs.length : b.items.length;
        for (let j = 0; j < n; j++) { const t = tagOf(x.set_id, i, j); if (t) add(byTag, t, rightOf(set.bai, i, j, x.answers) ? 1 : 0, 1); }
      });
    });
    rd.forEach(r => r.bai.forEach(b => add(byType, b.dang, +b.score, +b.max)));
    const typeRows = Object.entries(byType).map(([l, v]) => ({ l, p: pct(v.s, v.m), n: `${v.c} bài` })).sort((a, b) => a.p - b.p);
    const tagRows = Object.entries(byTag).map(([l, v]) => ({ l, p: pct(v.s, v.m), n: `${v.s}/${v.m} câu` })).sort((a, b) => a.p - b.p);
    const weak = [...tagRows.filter(r => r.p < 75).slice(0, 3).map(r => `${r.l} (${r.p}%)`), ...typeRows.filter(r => r.p < 75).slice(0, 2).map(r => `dạng ${r.l} (${r.p}%)`)];
    return `<section class="card"><h3>Cần ưu tiên luyện</h3>
      ${weak.length ? `<div class="callout"><b>${esc(D.student)}</b> đang dưới 75% ở: ${weak.map(esc).join(' · ')}.</div>` : `<div class="callout ok">${typeRows.length ? 'Tất cả các phần đều từ 75% trở lên. Có thể tăng độ khó.' : 'Chưa có dữ liệu để phân tích.'}</div>`}
      <p class="note">Tính trên ${at.length} đề làm trên web và ${rd.length} vòng tự luyện IOE. Nét đứt là mức đạt 75%.</p></section>
    <section class="card"><h3>Theo dạng bài</h3><p class="note">Gộp cả đề trên web và vòng tự luyện IOE.</p>${typeRows.length ? hbars(typeRows) : '<p class="muted">Chưa có dữ liệu.</p>'}</section>
    <section class="card"><h3>Theo kỹ năng</h3><p class="note">Tính từ từng câu trong các đề trên web.</p>${tagRows.length ? hbars(tagRows) : '<p class="muted">Chưa có dữ liệu.</p>'}</section>`;
  }

  function roundForm() {
    const e = D.edit ? D.rounds.find(r => r.id === D.edit) : null;
    const no = e ? e.round_no : (mine(D.rounds).reduce((m, r) => Math.max(m, r.round_no), 0) + 1);
    const bai = e ? e.bai : (ROUND_FMT[no] || [['Nối từ', 60], ['Nghe', 100], ['Đọc hiểu', 100], ['Điền từ', 100]]).map(([dang, max]) => ({ dang, score: '', max }));
    return `<section class="card"><h3>${e ? 'Sửa' : 'Nhập'} điểm vòng tự luyện IOE</h3>
      <p class="note">Vòng 1–8 đã điền sẵn dạng bài theo đề năm 2026–2027. Bài nối từ tối đa 60 điểm, các bài khác 100 điểm.</p>
      <div class="fgrid">
        <div class="field"><label for="r-stu">Học sinh</label><input id="r-stu" list="r-stus" value="${esc(e ? e.student : (D.student || ''))}"><datalist id="r-stus">${students().map(n => `<option value="${esc(n)}">`).join('')}</datalist></div>
        <div class="field"><label for="r-no">Vòng số</label><input id="r-no" type="number" min="1" max="60" value="${no}" ${e ? 'disabled' : ''}></div>
        <div class="field"><label for="r-date">Ngày làm</label><input id="r-date" type="date" value="${e && e.done_on ? e.done_on : new Date().toISOString().slice(0, 10)}"></div></div>
      ${bai.map((b, i) => `<div class="fgrid"><div class="field"><label for="r-d${i}">Bài ${i + 1} · dạng</label><select id="r-d${i}" class="sel">${DANG.map(x => `<option ${x === b.dang ? 'selected' : ''}>${x}</option>`).join('')}</select></div>
        <div class="field"><label for="r-s${i}">Điểm</label><input id="r-s${i}" type="number" min="0" step="5" value="${b.score}"></div>
        <div class="field"><label for="r-m${i}">Tối đa</label><input id="r-m${i}" type="number" min="1" step="10" value="${b.max}"></div></div>`).join('')}
      <div class="field"><label for="r-note">Ghi chú (không bắt buộc)</label><input id="r-note" value="${esc(e && e.note || '')}"></div>
      <div class="row"><button class="btn go" id="r-save">Lưu vòng</button>${e ? '<button class="btn" id="r-cancel">Huỷ sửa</button>' : ''}<span id="r-msg" class="note"></span></div></section>`;
  }

  function wireTab() {
    $$('[data-detail]').forEach(b => b.onclick = () => {
      const x = mine(D.attempts)[+b.dataset.detail];
      if (!SETS[x.set_id]) return;
      if (isHWrow(x)) { D.tab = 'hw'; return openGrade(x); }
      useSet(x.set_id);
      T.r = { id: x.set_id, n: x.student, at: x.created_at, s: x.seconds || 0, u: x.per_bai_seconds || [0, 0, 0, 0], a: x.answers };
      T.all = false; tReview(); window.scrollTo(0, 0);
      const back = $('#back'); if (back) back.textContent = '← Về bảng theo dõi';
    });
    $$('[data-grade]').forEach(b => b.onclick = () => openGrade(D.attempts.find(x => x.id === b.dataset.grade)));
    $$('[data-tab2]').forEach(b => b.onclick = () => { D.tab = 'round'; D.edit = null; dashView(); });
    $$('[data-edit]').forEach(b => b.onclick = () => { D.edit = b.dataset.edit; D.tab = 'round'; dashView(); });
    $$('[data-del]').forEach(b => b.onclick = async () => {
      if (D.del !== b.dataset.del) { D.del = b.dataset.del; return dashView(); }
      const { error } = await sb.from('ioe_rounds').delete().eq('id', D.del); D.del = null;
      if (error) D.msg = error.message; await load();
    });
    const no = $('#r-no');
    if (no && !D.edit) no.oninput = () => { const f = ROUND_FMT[+no.value]; if (f) f.forEach(([dang, max], i) => { $('#r-d' + i).value = dang; $('#r-m' + i).value = max; }); };
    for (let i = 0; i < 4; i++) { const d = $('#r-d' + i); if (d) d.onchange = () => { $('#r-m' + i).value = d.value === 'Nối từ' ? 60 : 100; }; }
    const save = $('#r-save');
    if (save) save.onclick = async () => {
      const msg = t => $('#r-msg').textContent = t;
      const student = normName($('#r-stu').value), round_no = +$('#r-no').value;
      const bai = [0, 1, 2, 3].map(i => ({ dang: $('#r-d' + i).value, score: +$('#r-s' + i).value, max: +$('#r-m' + i).value }));
      if (!student) return msg('Nhập tên học sinh (giống tên học sinh gõ khi làm bài trên web).');
      if (!(round_no >= 1)) return msg('Nhập số vòng.');
      if (bai.some(b => $('#r-s' + bai.indexOf(b)).value === '' || b.score < 0 || b.score > b.max)) return msg('Điểm mỗi bài phải từ 0 đến điểm tối đa.');
      msg('Đang lưu…');
      const row = { student, round_no, done_on: $('#r-date').value || null, bai, note: $('#r-note').value.trim() || null };
      const { error } = D.edit ? await sb.from('ioe_rounds').update(row).eq('id', D.edit) : await sb.from('ioe_rounds').upsert(row, { onConflict: 'student,round_no' });
      if (error) return msg('Chưa lưu được: ' + error.message);
      D.edit = null; D.tab = 'track'; D.student = student; await load();
    };
    const c = $('#r-cancel'); if (c) c.onclick = () => { D.edit = null; D.tab = 'track'; dashView(); };
  }

  dashStart();
}

</script>
</body>
</html>
