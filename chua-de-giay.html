.tabs{display:flex;gap:8px;flex-wrap:wrap}.kpi4{grid-template-columns:repeat(4,minmax(0,1fr))}

h2 .sel{font:800 24px var(--font-display)}
.track{width:100%;border-collapse:collapse;font-size:15px}.track th,.track td{padding:10px 8px;border-bottom:1px solid var(--line);text-align:left;white-space:nowrap;vertical-align:middle}
.track th{font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}.track td.good{color:var(--ok);font-weight:800}.track td.bad{color:var(--bad);font-weight:800}
.scroll{overflow-x:auto;min-width:0}.trend{width:100%;min-width:420px;height:auto}.trend .ax{font-size:11px;fill:var(--muted)}.trend .val{font-size:11px;font-weight:800;fill:var(--ink)}
.trend .grid{stroke:var(--line)}.trend .pass{stroke:var(--muted);stroke-dasharray:5 4}.trend .bw{fill:var(--sky)}.trend .bi{fill:var(--peach)}.trend .bp{fill:var(--teach)}.lg.bw{color:var(--sky)}.lg.bi{color:var(--peach)}.lg.bp{color:var(--teach)}.track.wrap td{white-space:normal;min-width:90px}

.hbar.bad i{background:var(--bad)}.hbar .m75{position:absolute;left:75%;top:-4px;bottom:-4px;border-left:2px dashed var(--muted)}.hbar .num{white-space:nowrap}

.chip-piece.on{border-color:var(--sky)}.chip-piece:hover{border-color:var(--sky)}
.chip:not(.ok):not(.bad){background:var(--sky-soft);color:var(--ink)}.btn.go-small{background:var(--go);color:var(--go-ink)}
.callout{background:var(--bad-soft);border-radius:16px;padding:14px 18px;line-height:1.7}.callout.ok{background:var(--ok-soft)}
.sel{font:inherit;border:2px solid var(--line);border-radius:14px;background:var(--bg);color:var(--ink);padding:10px 14px;min-width:220px;max-width:100%}
.retry-feedback{flex-wrap:wrap}.home-btn{text-decoration:none;margin-left:12px}

<body>
<header class="brandline"><span class="brandmark">✦</span><span class="brandname">Góc học tiếng Anh</span><span class="note">Chữa bài cùng cô</span><a class="btn small home-btn" href="index.html">⌂ Trang chủ</a></header>
<main id="app"><section class="card"><p class="muted">Đang mở bài cô đã chữa…</p></section></main>
<script>
(function () {
  const SB_URL = 'https://oywgqkbhhydcdftbgpau.supabase.co', SB_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im95d2dxa2JoaHlkY2RmdGJncGF1Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTEzODExMDQsImV4cCI6MjEwNjk1NzEwNH0.POFHUhiVNlLLZTeow1DxfqeiPJbwne6Nx9cGbob-Qb4';
  const $ = s => document.querySelector(s), $$ = s => [...document.querySelectorAll(s)];
  const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
  const norm = s => String(s).toLowerCase().replace(/[’']/g, "'").replace(/[.,?!“”"]/g, ' ').replace(/\s+/g, ' ').trim();
  const shuffle = a => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
  const rpc = (fn, body) => fetch(SB_URL + '/rest/v1/rpc/' + fn, { method: 'POST',
    headers: { apikey: SB_KEY, Authorization: 'Bearer ' + SB_KEY, 'Content-Type': 'application/json' }, body: JSON.stringify(body) });
  const id = new URLSearchParams(location.search).get('chua');
  let P = null; const st = {};   // st[q] = { ok, val, order:[], pool:[] }
  let sendState = '';

  async function load() {
    let row = null;
    try { const r = await rpc('get_shared_paper', { p_id: id }); if (r.ok) row = (await r.json())[0]; } catch (e) {}
    if (!row || !row.retry) {
      $('#app').innerHTML = '<section class="card"><h2>Chưa mở được bài chữa</h2><p class="muted">Có thể cô chưa chia sẻ bài này, hoặc máy đang mất mạng. Em quay lại trang chủ và thử lại sau nhé.</p><div class="row"><a class="btn go" href="index.html">⌂ Về trang chủ</a></div></section>';
      return;
    }
    P = row;
    const fixed = (row.corrections && row.corrections.fixed) || [];
    row.retry.forEach(it => { st[it.q] = { ok: fixed.includes(it.q) ? true : null, val: '', order: [], pool: it.pieces ? shuffle(it.pieces.map((p, i) => i)) : [] }; });
    if (row.corrections) sendState = 'ok';
    render();
  }

  function card(it) {
    const s = st[it.q];
    const fb = s.ok === true ? `<div class="retry-feedback ok"><img class="feedback-mascot" src="img/fox-correct.png" alt=""><span class="feedback ok">Giỏi lắm!</span>${it.note ? `<span class="note">${esc(it.note)}</span>` : ''}</div>`
      : s.ok === false ? '<div class="retry-feedback"><img class="feedback-mascot" src="img/fox-wrong.png" alt=""><span class="feedback bad">Chưa đúng, thử lại nhé!</span></div>' : '';
    let body = '';
    if (it.kind === 'mcq') {
      body = `<div class="qtext">${esc(it.text)}</div><div class="opts">${it.options.map((o, n) => `<button class="opt ${s.val === n ? 'sel' : ''}" data-q="${it.q}" data-v="${n}"><span class="k">${'ABCD'[n]}</span><span>${esc(o)}</span></button>`).join('')}</div>`;
    } else if (it.kind === 'order') {
      body = `<div class="qtext">Sắp xếp thành câu đúng:</div>
        <div class="order-line" aria-label="Câu em đang xếp">${s.order.length ? s.order.map(i => `<button class="chip-piece on" data-q="${it.q}" data-out="${i}">${esc(it.pieces[i])}</button>`).join('') : '<span class="note">Bấm vào các mảnh bên dưới theo đúng thứ tự.</span>'}</div>
        <div class="order-pool">${s.pool.filter(i => !s.order.includes(i)).map(i => `<button class="chip-piece" data-q="${it.q}" data-in="${i}">${esc(it.pieces[i])}</button>`).join('')}</div>
        <div class="row"><button class="btn small" data-reset="${it.q}">Xếp lại</button><button class="btn small go-small" data-check="${it.q}">Kiểm tra</button></div>`;
    } else {
      body = `<div class="qtext">${esc(it.text)}</div>
        <div class="row"><input class="sel ans" data-q="${it.q}" value="${esc(s.val)}" placeholder="${it.kind === 'letter' ? '1 chữ cái' : 'Gõ từ còn thiếu'}" autocomplete="off" spellcheck="false" ${it.kind === 'letter' ? 'maxlength="1"' : ''}>
        <button class="btn small go-small" data-check="${it.q}">Kiểm tra</button></div>`;
    }
    return `<div class="item ${s.ok ? 'okk' : ''}" id="q-${it.q}"><div class="item-head"><span class="where">Câu ${it.q}</span><span class="chip">${esc(it.type)}</span></div>
      ${body}<div class="note">Lúc làm bài em đã làm: ${esc(it.student)}</div>${fb}</div>`;
  }

  function render() {
    const y = window.scrollY;
    const done = P.retry.filter(it => st[it.q].ok === true).length;
    $('#app').innerHTML = `<section class="card">
      <div class="eyebrow">Chữa bài · ${esc(P.student)} · ${P.done_on ? new Date(P.done_on).toLocaleDateString('vi-VN') : ''}</div>
      <h1>${esc(P.title)}</h1>
      <p class="muted">Điểm lần làm trên giấy: <b>${P.score2000}/2000</b> (${P.correct}/${P.total_q} câu đúng). Nghe cô giải thích, rồi làm lại từng câu sai bên dưới.</p>
      ${P.teacher_note ? `<div class="callout ok"><b>Nhận xét của cô:</b> ${esc(P.teacher_note)}</div>` : ''}
      <div class="row"><span class="chip ${done === P.retry.length ? 'ok' : 'bad'}">Đã sửa đúng ${done}/${P.retry.length}</span><span class="spacer"></span>
        <button class="btn go" id="send">Gửi bài chữa cho cô</button></div>
      <p class="note" id="send-msg">${sendState === 'ok' ? '✓ Đã gửi bài chữa cho cô. Em sửa thêm thì bấm gửi lại.' : sendState === 'fail' ? 'Chưa gửi được, em thử lại nhé.' : ''}</p>
    </section>
    <section class="card"><div class="items">${P.retry.map(card).join('')}</div></section>`;
    window.scrollTo(0, y);
    $$('.opt[data-q]').forEach(b => b.onclick = () => { const it = byQ(b.dataset.q), s = st[it.q]; s.val = +b.dataset.v; s.ok = s.val === it.k; render(); });
    $$('[data-in]').forEach(b => b.onclick = () => { const s = st[b.dataset.q]; s.order.push(+b.dataset.in); s.ok = null; render(); });
    $$('[data-out]').forEach(b => b.onclick = () => { const s = st[b.dataset.q]; s.order = s.order.filter(i => i !== +b.dataset.out); s.ok = null; render(); });
    $$('[data-reset]').forEach(b => b.onclick = () => { const s = st[b.dataset.reset]; s.order = []; s.ok = null; render(); });
    $$('input.ans').forEach(inp => {
      inp.oninput = () => { st[inp.dataset.q].val = inp.value; };
      inp.onkeydown = e => { if (e.key === 'Enter') check(inp.dataset.q); };
    });
    $$('[data-check]').forEach(b => b.onclick = () => check(b.dataset.check));
    $('#send').onclick = send;
  }
  const byQ = q => P.retry.find(it => String(it.q) === String(q));
  function check(q) {
    const it = byQ(q), s = st[it.q];
    if (it.kind === 'order') {
      if (s.order.length < it.pieces.length) { s.ok = false; return render(); }
      s.ok = norm(s.order.map(i => it.pieces[i]).join(' ')) === norm(it.answer);
    } else if (it.kind === 'letter') s.ok = norm(s.val) === it.answer;
    else s.ok = it.alts.some(a => norm(a) === norm(s.val));
    render();
  }
  async function send() {
    const fixed = P.retry.filter(it => st[it.q].ok === true).map(it => it.q);
    $('#send-msg').textContent = 'Đang gửi…';
    try { const r = await rpc('submit_paper_correction', { p_id: P.id, p_data: { fixed, wrong: P.retry.map(it => it.q), at: new Date().toISOString() } }); sendState = r.ok && (await r.json()) === true ? 'ok' : 'fail'; }
    catch (e) { sendState = 'fail'; }
    render();
    $('#send-msg').textContent = sendState === 'ok' ? `✓ Đã gửi bài chữa cho cô (đúng ${fixed.length}/${P.retry.length} câu).` : 'Chưa gửi được, em thử lại nhé.';
  }
  load();
})();

</script>
